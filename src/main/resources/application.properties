spring.application.name=resource-booking-api
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/resource_booking
spring.datasource.username=postgres
spring.datasource.password=Nisha@12
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:change-this-secret-key-for-local-development-only}
jwt.expiration=${JWT_EXPIRATION:86400000}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html